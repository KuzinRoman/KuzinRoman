  <rect width="400" height="225" rx="10" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="399" height="224" rx="9.5" fill="none" stroke="#2C3A4D"/>
  <rect x="0" y="0" width="400" height="3" rx="1.5" fill="url(#accent)"/>

